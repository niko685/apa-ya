<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Peter — Arsip</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background: #f4f1ea;
      color: #1a1a1a;
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    .card {
      max-width: 420px;
      text-align: center;
    }
    h1 { font-weight: 400; letter-spacing: 0.06em; }
    p { color: #555; line-height: 1.55; }
    a {
      color: #7a3b2e;
      text-decoration: none;
      border-bottom: 1px solid currentColor;
    }
    .nest { width: 100%; height: 40vh; overflow: hidden; opacity: 0.04; pointer-events: none; }
    .nest div { width: 200%; height: 200%; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Peter</h1>
    <p>
      Arsip ini kosong. Atau mungkin kamu hanya belum meminta dengan benar.
    </p>
    <p>
      Coba endpoint internal:
      <a href="/api/go">/api/go</a>
    </p>
  </div>
  <!-- jebakan ringan: nested blur (bukan payload berbahaya) -->
  <div class="nest" aria-hidden="true"><div><div><div><div><div><div><div><div><div><div></div></div></div></div></div></div></div></div></div></div></div>
</body>
</html>
