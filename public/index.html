<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Makam China</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #f0e6d8;
      --muted: #a89880;
      --fog: rgba(180, 160, 130, 0.12);
      --line: rgba(240, 230, 216, 0.2);
      --accent: #c4a574;
      --void: #070605;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--void);
      color: var(--ink);
      font-family: "Outfit", sans-serif;
      overflow-x: hidden;
    }

    .scene {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: 1fr auto;
      isolation: isolate;
    }

    /* Full-bleed photo plane */
    .hero-media {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #0c0a08;
    }

    .hero-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 40%;
      transform: scale(1.08);
      filter: grayscale(35%) contrast(1.12) brightness(0.55);
      transition: transform 1.4s cubic-bezier(0.22, 1, 0.36, 1), filter 0.8s ease;
      will-change: transform;
    }

    .scene.is-ready .hero-media img {
      transform: scale(1);
      animation: drift 28s ease-in-out infinite alternate;
    }

    .scene:hover .hero-media img {
      filter: grayscale(15%) contrast(1.15) brightness(0.62);
    }

    @keyframes drift {
      from { transform: scale(1) translate3d(0, 0, 0); }
      to { transform: scale(1.04) translate3d(-1.2%, -0.6%, 0); }
    }

    .veil {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 70% 55% at 50% 35%, transparent 0%, rgba(7, 6, 5, 0.35) 55%, rgba(7, 6, 5, 0.92) 100%),
        linear-gradient(180deg, rgba(7, 6, 5, 0.55) 0%, transparent 28%, transparent 48%, rgba(7, 6, 5, 0.88) 100%);
    }

    .grain {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0.28;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .mist {
      position: absolute;
      inset: -20% -10%;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(ellipse 40% 30% at 20% 70%, var(--fog), transparent 70%),
        radial-gradient(ellipse 45% 35% at 80% 60%, rgba(160, 140, 110, 0.1), transparent 70%);
      animation: mist-shift 16s ease-in-out infinite alternate;
      opacity: 0;
      transition: opacity 1.8s ease;
    }

    .scene.is-ready .mist { opacity: 1; }

    @keyframes mist-shift {
      from { transform: translate3d(-2%, 1%, 0); }
      to { transform: translate3d(3%, -2%, 0); }
    }

    /* Cursor spotlight */
    .lamp {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(
        420px circle at var(--mx, 50%) var(--my, 40%),
        rgba(196, 165, 116, 0.14),
        transparent 55%
      );
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .scene.is-ready .lamp { opacity: 1; }

    .copy {
      position: relative;
      z-index: 4;
      align-self: end;
      padding: clamp(1.5rem, 5vw, 3.5rem);
      padding-bottom: 0.5rem;
      max-width: 42rem;
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 1.1s ease, transform 1.1s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .scene.is-ready .copy {
      opacity: 1;
      transform: translateY(0);
    }

    .eyebrow {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1rem;
      opacity: 0.85;
    }

    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 600;
      font-size: clamp(3.2rem, 11vw, 6.5rem);
      line-height: 0.92;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-shadow: 0 8px 40px rgba(0, 0, 0, 0.55);
    }

    h1 em {
      font-style: italic;
      font-weight: 400;
      display: block;
      letter-spacing: 0.08em;
      color: #d8cbb8;
    }

    .lede {
      margin-top: 1.25rem;
      max-width: 28ch;
      font-weight: 300;
      font-size: clamp(1rem, 2.2vw, 1.15rem);
      line-height: 1.65;
      color: var(--muted);
    }

    .actions {
      position: relative;
      z-index: 4;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem 1.5rem;
      padding: clamp(1.25rem, 4vw, 2.5rem) clamp(1.5rem, 5vw, 3.5rem) clamp(1.75rem, 5vw, 3rem);
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 1s ease 0.25s, transform 1s cubic-bezier(0.22, 1, 0.36, 1) 0.25s;
    }

    .scene.is-ready .actions {
      opacity: 1;
      transform: translateY(0);
    }

    .btn {
      appearance: none;
      border: 1px solid rgba(196, 165, 116, 0.45);
      background: rgba(12, 10, 8, 0.35);
      color: var(--ink);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 0.95rem 1.4rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: border-color 0.35s ease, background 0.35s ease, transform 0.35s ease, color 0.35s ease;
    }

    .btn:hover,
    .btn:focus-visible {
      border-color: var(--accent);
      background: rgba(196, 165, 116, 0.14);
      color: #fff8ee;
      transform: translateY(-2px);
      outline: none;
    }

    .btn:active { transform: translateY(0); }

    .whisper {
      font-size: 0.78rem;
      font-weight: 300;
      color: rgba(168, 152, 128, 0.75);
      letter-spacing: 0.04em;
      max-width: 28ch;
      line-height: 1.5;
    }

    .whisper strong {
      font-weight: 400;
      color: var(--muted);
    }

    /* Mobile: keep brand dominant, image still full-bleed */
    @media (max-width: 640px) {
      .copy { max-width: none; }
      h1 { font-size: clamp(2.8rem, 16vw, 4rem); }
      .lamp {
        background: radial-gradient(
          280px circle at var(--mx, 50%) var(--my, 35%),
          rgba(196, 165, 116, 0.12),
          transparent 55%
        );
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-media img,
      .mist,
      .copy,
      .actions { animation: none !important; transition: none !important; }
      .scene.is-ready .hero-media img { transform: none; }
      .copy, .actions { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="scene" id="scene">
    <div class="hero-media" aria-hidden="true">
      <img src="image.jpg" alt="" id="heroImg" />
    </div>
    <div class="veil"></div>
    <div class="grain"></div>
    <div class="mist"></div>
    <div class="lamp" id="lamp"></div>

    <div class="copy">
      <p class="eyebrow">Sebuah jejak yang tertinggal</p>
      <h1>Makam <em>China</em></h1>
      <p class="lede">
        Yang dikubur belum tentu hilang. Ada yang menunggu untuk ditemukan —
        pelan-pelan, di balik yang tampak.
      </p>
    </div>

    <div class="actions">
      <a class="btn" id="saveBtn" href="image.jpg" download="image.jpg">Simpan kenangan</a>
      <p class="whisper">
        Jangan hanya melihat. <strong>Simpan file-nya</strong> —
        rahasia jarang tertulis di permukaan.
      </p>
    </div>
  </div>

  <script>
    (function () {
      var scene = document.getElementById("scene");
      var lamp = document.getElementById("lamp");
      var img = document.getElementById("heroImg");

      function ready() {
        scene.classList.add("is-ready");
      }

      if (img.complete && img.naturalWidth) ready();
      else {
        img.addEventListener("load", ready);
        img.addEventListener("error", ready);
      }
      // fallback jika cache aneh
      setTimeout(ready, 1200);

      var mx = 50, my = 40, tx = 50, ty = 40;
      window.addEventListener("pointermove", function (e) {
        tx = (e.clientX / window.innerWidth) * 100;
        ty = (e.clientY / window.innerHeight) * 100;
      }, { passive: true });

      function tick() {
        mx += (tx - mx) * 0.08;
        my += (ty - my) * 0.08;
        lamp.style.setProperty("--mx", mx.toFixed(2) + "%");
        lamp.style.setProperty("--my", my.toFixed(2) + "%");
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
