<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pora</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    .wrap {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      pointer-events: none;
    }
    .shield {
      position: absolute;
      inset: 0;
      z-index: 2;
    }
  </style>
</head>
<body oncontextmenu="return false;">
  <!-- uploader nanopeterpen -->
  <div class="wrap">
    <iframe
      src="https://streamable.com/e/29jp1w?autoplay=1&muted=0&loop=1&nocontrols=1"
      allow="autoplay; fullscreen; encrypted-media"
      allowfullscreen
      title="pora"
    ></iframe>
    <div class="shield" aria-hidden="true"></div>
  </div>
  <script>
    document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    document.addEventListener("keydown", function (e) {
      if (e.key === "F12" || (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J" || e.key === "C"))) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
